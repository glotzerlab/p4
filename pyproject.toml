[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p4"
version = "0.0.1"
requires-python = ">=3.11"
description = "Probe the effective potential landscape around an analyte using HOOMD-blue."
readme = "readme.md"
license-files = ["LICENSE"]
authors = [
  { name = "Joseph Burkhart", email = "joaburkh@umich.edu" },
]
dependencies = [
    # Glotzer Group
    "gsd>=4.2.0",
    "coxeter>=0.10.0",
    "rowan>=1.3.2",

    # Data
    "numpy>=2.3.5", 

    # Plotting
    "plotly>=6.6.0",

    # Other
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
dev = [
  # Docs
  "sphinx>9.0",
  "furo>2025",
  "numpydoc>=1.10.0",
  "sphinx-copybutton>= 0.5.2",
  "autoclasstoc>=1.7.0",
  "sphinx-design>=0.7.0",

  # Testing
  "pytest>=9.0.2",
  "sybil[pytest]",
  "scipy>=1.16.3",
]

[tool.conda-lock]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.conda-lock.dependencies]
hoomd = ">=5.0.0"

[tool.uv.extra-build-dependencies]
p4 = ["setuptools"]

[tool.pytest.ini_options]
addopts = "-p no:doctest"
