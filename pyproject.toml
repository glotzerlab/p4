[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p4"
version = "0.0.1"
requires-python = ">=3.12"
description = "Probe the effective potential landscape around an analyte using HOOMD-blue."
readme = "readme.md"
license-files = ["LICENSE"]
authors = [
    {name = "Joseph Burkhart", email = "joaburkh@umich.edu"},
]
dependencies = [
    # Glotzer Group
    "gsd>=4.2.0",       # only really needed for debugging, unless I add support for Frame analytes
    "coxeter>=0.10.0",  # core
    "rowan>=1.3.2",     # core

    # Data
    "numpy>=2.3.5",     # core
    "pillow>=12.0.0",   # only needed for Field

    # Export
    "vtk>=9.5.2",       # only needed for Field
    "pandas>=2.3.3",    # only needed for Field

    # Plotting
    "matplotlib>=3.10.8",   # only needed for Field
]

[tool.conda-lock]
channels=["conda-forge"]
platforms=["osx-arm64", "linux-64"]

[tool.conda-lock.dependencies]
hoomd = ">=5.4.0"       # core
