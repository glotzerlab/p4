[workspace]
authors = ["Joseph Burkhart <joaburkh@umich.edu>"]
channels = ["conda-forge"]
name = "p4"
platforms = ["linux-64", "osx-arm64"]
version = "0.0.1"

[tasks]

[dependencies]
coxeter = ">=0.10.0"
gsd = ">=4.2.0"
hoomd = ">=7.0.1"
numpy = ">=2.4.2"
pytest = ">=9.0.3"
rowan = ">=1.3.2"
scipy = ">=1.17.0"
setuptools = ">=82.0.1"
sphinx-inline-tabs = ">=2025.12.21.14"
uv = ">=0.11.6"
bump-my-version = ">=1.3.0"
sybil = ">=10.0.1"
plotly = ">=6.0.0"

[pypi-dependencies]
autoclasstoc = ">=1.7.0"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
py314 = ["py314"]
